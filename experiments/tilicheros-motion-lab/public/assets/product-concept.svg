<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Control portátil de videojuegos conceptual</title>
  <desc id="desc">Ilustración genérica de consola con pantalla azul y controles morados; no representa un producto disponible.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#474461"/><stop offset=".45" stop-color="#171B35"/><stop offset="1" stop-color="#090C1A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2A1C65"/><stop offset=".48" stop-color="#0D587D"/><stop offset="1" stop-color="#09C8E3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A76CFF"/><stop offset="1" stop-color="#0BE8FF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="29"/>
    </filter>
    <filter id="borderglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
