# Verifica el catálogo (repos, skills y agentes) en cada cambio.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sin dependencias: no hace falta npm ci.
      - run: npm run check

      - name: Generate and show drift on failure
        if: failure()
        run: |
          npm run agents:build
          git diff -- INDEX.md | head -n 350
          git status --short | head -n 70
